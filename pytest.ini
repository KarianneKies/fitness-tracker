[pytest]
testpaths = tests
addopts = -q
# `python -m pytest` adds the repo root to sys.path automatically; bare
# `pytest` (what CI runs) does not, so `from backend...` in conftest.py
# fails with ModuleNotFoundError. This makes bare `pytest` behave the
# same way regardless of how/where it's invoked from.
pythonpath = .
filterwarnings =
    # SQLModel nudges toward session.exec(); this codebase uses session.query()
    # throughout on purpose - not this test suite's job to migrate it.
    ignore::DeprecationWarning
